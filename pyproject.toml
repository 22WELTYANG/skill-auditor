[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-auditor"
version = "0.9.0"
description = "Security scanner for AI agent skills, prompt injection, malicious installers, and supply-chain risks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "22WELTYANG" }]
keywords = [
  "ai-security",
  "agent-security",
  "codex",
  "claude-code",
  "cursor",
  "llm-security",
  "prompt-injection",
  "devsecops",
  "supply-chain-security",
  "github-actions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=8", "build>=1", "PyYAML>=6", "pre-commit>=3.7", "jsonschema>=4.23"]

[project.scripts]
skill-auditor = "skill_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/22WELTYANG/skill-auditor"
Repository = "https://github.com/22WELTYANG/skill-auditor"
Documentation = "https://github.com/22WELTYANG/skill-auditor/tree/main/docs"
Changelog = "https://github.com/22WELTYANG/skill-auditor/blob/main/CHANGELOG.md"
Issues = "https://github.com/22WELTYANG/skill-auditor/issues"
Security = "https://github.com/22WELTYANG/skill-auditor/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_auditor = ["rules/*.yaml", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
