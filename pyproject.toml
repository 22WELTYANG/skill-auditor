[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-auditor"
version = "0.4.0"
description = "Security scanner and install gate for AI Agent skills"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "22WELTYANG" }]
keywords = ["security", "ai", "agent", "skills", "scanner"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=8", "build>=1", "PyYAML>=6"]

[project.scripts]
skill-auditor = "skill_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/22WELTYANG/skill-auditor"
Repository = "https://github.com/22WELTYANG/skill-auditor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_auditor = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
