name: Python checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile sources
        run: python -m compileall src scripts tests
      - name: Check generated catalog
        run: python scripts/render_catalog.py --check
      - name: Run zero-dependency regression suite
        run: python scripts/run_tests.py
      - name: Run pytest contracts
        run: python -m pytest
      - name: Verify console and module entry points
        run: |
          skill-auditor --version
          python -m skill_auditor --version
          skill-auditor examples/clean-skill --format json
          skill-auditor examples/clean-skill --format text
          skill-auditor examples/clean-skill --format markdown
          skill-auditor examples/clean-skill --format sarif

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run without site packages to exercise YAML fallback
        run: python -S scripts/run_tests.py
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          skill-auditor --version
