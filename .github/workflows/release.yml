name: Release

# Pushing a v* tag publishes to PyPI (Trusted Publishing — configure the
# pending publisher for project "skill-auditor", workflow "release.yml",
# environment "pypi" on pypi.org first) and creates the GitHub release.

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install editable package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check generated catalog and rule mirror
        run: python scripts/render_catalog.py --check
      - name: Run zero-dependency regression suite
        run: python scripts/run_tests.py
      - name: Run pytest contracts
        run: python -m pytest
      - name: Tag must match the package version
        run: |
          VERSION=$(python -c "import skill_auditor; print(skill_auditor.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          skill-auditor --version
          skill-auditor examples/clean-skill --format json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
