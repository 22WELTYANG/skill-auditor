# Credential-read rules (deterministic).
# Edit rules here, then run scripts/render_catalog.py to refresh the catalog.
rules:
  - id: CRED-001
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?:~|\$HOME|/home/[^/\s]+|/root)?/?\.ssh/(?:id_[a-z0-9]+|authorized_keys|known_hosts)|\.ssh/id_'
    rationale: Reads SSH private keys or trusted-host files, which grant direct access to remote servers.
    guidance: ''
  - id: CRED-002
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?:~|\$HOME)?/?\.aws/(?:credentials|config)\b|\bAWS_SECRET_ACCESS_KEY\b|\bAWS_ACCESS_KEY_ID\b|\bAWS_SESSION_TOKEN\b'
    rationale: Reads AWS credentials, granting access to cloud resources and billing.
    guidance: ''
  - id: CRED-003
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '\.config/gcloud\b|\bGOOGLE_APPLICATION_CREDENTIALS\b|\.azure/(?:credentials|accessTokens)\b|\.kube/config\b|\.docker/config\.json\b|(?:~|\$HOME)?/?\.(?:netrc|npmrc|pypirc|git-credentials)\b'
    rationale: Reads cloud, cluster, or package-registry credential files.
    guidance: ''
  - id: CRED-004
    category: credential-read
    severity: WARNING
    layer: deterministic
    pattern: '\b(?:cat|source|read|less|more|grep|load_dotenv|dotenv)\b[^\n]*\.env\b|(?:^|[\s"\x27/=])\.env(?:\.[\w.]+)?(?:\b|$)'
    rationale: Reads a .env file, which usually holds the current project secrets.
    guidance: ''
  - id: CRED-005
    category: credential-read
    severity: WARNING
    layer: deterministic
    pattern: '\bsecurity\s+find-(?:generic|internet)-password\b|\b(?:cat|read|less|more|printenv|echo)\b[^\n]*\b[\w./-]*token[\w./-]*\b'
    rationale: Reads OS keychain entries or token-bearing files.
    guidance: ''
  - id: CRED-006
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?i)(?:\$(?:GITHUB_TOKEN|GH_TOKEN)\b|process\.env\.(?:GITHUB_TOKEN|GH_TOKEN)\b|os\.(?:environ|getenv)[^\n]{0,40}(?:GITHUB_TOKEN|GH_TOKEN)|Env:(?:GITHUB_TOKEN|GH_TOKEN)\b|(?:cat|printenv|echo|env|Get-Content|type)\b[^\n]*(?:(?:GITHUB_TOKEN|GH_TOKEN)|github_pat_|gh[pousr]_))'
    rationale: Reads a GitHub Actions token or personal access token that can grant repository and organization access.
    guidance: ''
  - id: CRED-007
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?i)(?:\.config/gcloud/application_default_credentials\.json|gcloud\s+auth\s+application-default\s+print-access-token|GOOGLE_APPLICATION_CREDENTIALS|service[_ -]?account[^\n]{0,30}private[_ -]?key)'
    rationale: Reads or exports GCP application-default credentials, access tokens, or service-account private key material.
    guidance: ''
  - id: CRED-008
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?i)(?:\.azure/(?:accessTokens\.json|msal_token_cache)|AZURE_CLIENT_SECRET|az\s+account\s+get-access-token|(?:SharedAccessSignature|sig=)[^\n]{0,80}(?:sv=|se=))'
    rationale: Reads Azure client secrets, cached tokens, access tokens, or shared-access signatures.
    guidance: ''
  - id: CRED-009
    category: credential-read
    severity: WARNING
    layer: deterministic
    pattern: '(?i)\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|ya29\.[A-Za-z0-9_-]{20,})\b|\bsv=\d{4}-\d{2}-\d{2}[^\s]{0,200}&sig=[A-Za-z0-9%+/=_-]{16,}'
    rationale: Contains a GitHub, GCP, or Azure token-shaped literal that may be a committed credential.
    guidance: Confirm the value is synthetic or revoked; never publish a live credential.
