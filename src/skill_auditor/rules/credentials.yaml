# Credential-read rules (deterministic).
# Edit rules here, then run scripts/render_catalog.py to refresh the catalog.
rules:
  - id: CRED-001
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?:~|\$HOME|/home/[^/\s]+|/root)?/?\.ssh/(?:id_[a-z0-9]+|authorized_keys|known_hosts)|\.ssh/id_'
    rationale: Reads SSH private keys or trusted-host files, which grant direct access to remote servers.
    guidance: ''
  - id: CRED-002
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '(?:~|\$HOME)?/?\.aws/(?:credentials|config)\b|\bAWS_SECRET_ACCESS_KEY\b|\bAWS_ACCESS_KEY_ID\b|\bAWS_SESSION_TOKEN\b'
    rationale: Reads AWS credentials, granting access to cloud resources and billing.
    guidance: ''
  - id: CRED-003
    category: credential-read
    severity: CRITICAL
    layer: deterministic
    pattern: '\.config/gcloud\b|\bGOOGLE_APPLICATION_CREDENTIALS\b|\.azure/(?:credentials|accessTokens)\b|\.kube/config\b|\.docker/config\.json\b|(?:~|\$HOME)?/?\.(?:netrc|npmrc|pypirc|git-credentials)\b'
    rationale: Reads cloud, cluster, or package-registry credential files.
    guidance: ''
  - id: CRED-004
    category: credential-read
    severity: WARNING
    layer: deterministic
    pattern: '\b(?:cat|source|read|less|more|grep|load_dotenv|dotenv)\b[^\n]*\.env\b|(?:^|[\s"\x27/=])\.env(?:\.[\w.]+)?(?:\b|$)'
    rationale: Reads a .env file, which usually holds the current project secrets.
    guidance: ''
  - id: CRED-005
    category: credential-read
    severity: WARNING
    layer: deterministic
    pattern: '\bsecurity\s+find-(?:generic|internet)-password\b|\b(?:cat|read|less|more|printenv|echo)\b[^\n]*\b[\w./-]*token[\w./-]*\b'
    rationale: Reads OS keychain entries or token-bearing files.
    guidance: ''
