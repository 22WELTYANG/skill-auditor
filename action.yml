name: skill-auditor
description: Scan AI Agent Skills and publish GitHub Code Scanning annotations.
author: 22WELTYANG
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Repository-relative directory or Skill path to scan.
    default: .
  recursive:
    description: Discover and scan every Skill root below path.
    default: "true"
  fail-on:
    description: Minimum severity that fails the job.
    default: critical
  min-severity:
    description: Minimum severity included in rendered reports.
    default: info
  config:
    description: Trusted repository-relative config loaded from the base commit.
    default: ""
  baseline:
    description: auto, none, or a repository-relative baseline from the base commit.
    default: auto
  upload-sarif:
    description: Upload SARIF to GitHub Code Scanning.
    default: "true"
  upload-report:
    description: Upload JSON and SARIF workflow artifacts.
    default: "true"
  artifact-name:
    description: Name of the uploaded JSON and SARIF artifact.
    default: skill-auditor-report
  sarif-category:
    description: GitHub Code Scanning category for the SARIF upload.
    default: skill-auditor
outputs:
  verdict:
    value: ${{ steps.scan.outputs.verdict }}
  critical:
    value: ${{ steps.scan.outputs.critical }}
  warning:
    value: ${{ steps.scan.outputs.warning }}
  info:
    value: ${{ steps.scan.outputs.info }}
  exit-code:
    value: ${{ steps.scan.outputs['exit-code'] }}
  sarif-file:
    value: ${{ steps.scan.outputs['sarif-file'] }}
  json-file:
    value: ${{ steps.scan.outputs['json-file'] }}
  content-hash:
    value: ${{ steps.scan.outputs['content-hash'] }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - name: Install skill-auditor
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan Skills
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_FAIL_ON: ${{ inputs['fail-on'] }}
        INPUT_MIN_SEVERITY: ${{ inputs['min-severity'] }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_UPLOAD_SARIF: ${{ inputs['upload-sarif'] }}
        INPUT_UPLOAD_REPORT: ${{ inputs['upload-report'] }}
        INPUT_ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
        INPUT_SARIF_CATEGORY: ${{ inputs['sarif-category'] }}
      run: python -m skill_auditor.action_runner
    - name: Upload SARIF
      if: ${{ inputs['upload-sarif'] == 'true' && always() && steps.scan.outputs['sarif-file'] != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
      with:
        sarif_file: ${{ steps.scan.outputs['sarif-file'] }}
        category: ${{ inputs['sarif-category'] }}
    - name: Upload audit reports
      if: ${{ inputs['upload-report'] == 'true' && always() && steps.scan.outputs['json-file'] != '' && steps.scan.outputs['sarif-file'] != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs['artifact-name'] }}
        path: |
          ${{ steps.scan.outputs['json-file'] }}
          ${{ steps.scan.outputs['sarif-file'] }}
    - name: Apply scan gate
      if: ${{ always() }}
      shell: bash
      env:
        SCAN_EXIT_CODE: ${{ steps.scan.outputs['exit-code'] }}
      run: |
        case "$SCAN_EXIT_CODE" in
          0|1|2|3) exit "$SCAN_EXIT_CODE" ;;
          *) exit 3 ;;
        esac
